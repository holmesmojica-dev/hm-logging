name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: hm-logging-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: pwsh
        run: ./scripts/Resolve-ReleaseVersion.ps1 -Tag "$env:GITHUB_REF_NAME" -MainBranch 'origin/main' -GitHubOutputPath "$env:GITHUB_OUTPUT"

  build-artifact:
    name: Build release artifacts
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      artifact_name: release-packages
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build and validate release artifacts
        shell: pwsh
        run: >
          ./scripts/Build-ReleaseArtifact.ps1
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"
          -SourceCommit "${{ needs.preflight.outputs.source_commit }}"
          -OutputDirectory artifacts/packages

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  attest-artifacts:
    name: Attest release artifacts
    needs: [preflight, build-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}

      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-artifact.outputs.artifact_name }}
          path: artifacts/packages

      - name: Verify validated artifact integrity
        shell: pwsh
        run: >
          ./scripts/Assert-ReleaseArtifactManifest.ps1
          -PackageDirectory artifacts/packages
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"

      - name: Attest NuGet package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/packages/HDev.Hm.Logging.Core.${{ needs.preflight.outputs.release_version }}.nupkg

      - name: Attest NuGet symbol package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/packages/HDev.Hm.Logging.Core.${{ needs.preflight.outputs.release_version }}.snupkg

      - name: Verify NuGet artifact attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "artifacts/packages/HDev.Hm.Logging.Core.${{ needs.preflight.outputs.release_version }}.nupkg" --repo "$env:GITHUB_REPOSITORY" --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/publish-nuget.yml"
          gh attestation verify "artifacts/packages/HDev.Hm.Logging.Core.${{ needs.preflight.outputs.release_version }}.snupkg" --repo "$env:GITHUB_REPOSITORY" --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/publish-nuget.yml"

  publish-nuget:
    name: Publish NuGet
    needs: [preflight, build-artifact, attest-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-artifact.outputs.artifact_name }}
          path: artifacts/packages

      - name: Verify validated artifact integrity
        shell: pwsh
        run: >
          ./scripts/Assert-ReleaseArtifactManifest.ps1
          -PackageDirectory artifacts/packages
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish exact validated NuGet artifacts
        shell: pwsh
        env:
          NUGET_TRUSTED_PUBLISHING_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          ./scripts/Publish-NuGetRelease.ps1
          -PackageDirectory artifacts/packages
          -ReleaseVersion "${{ needs.preflight.outputs.release_version }}"
          -SourceCommit "${{ needs.preflight.outputs.source_commit }}"
